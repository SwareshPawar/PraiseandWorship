<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Management Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Backend Management Debug</h1>
    <div id="results"></div>
    
    <script>
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = message;
            document.getElementById('results').appendChild(div);
        }
        
        function checkElement(id) {
            const element = document.getElementById(id);
            if (element) {
                log(`✅ Found element: ${id}`, 'success');
                return true;
            } else {
                log(`❌ Missing element: ${id}`, 'error');
                return false;
            }
        }
        
        // Check if backend management elements exist
        log('Checking Backend Management Elements:', 'info');
        checkElement('backendMgmtTab');
        checkElement('backendMgmtTabContent');
        checkElement('currentBackendStatus');
        checkElement('currentApiUrl');
        checkElement('switchToRenderBtn');
        checkElement('switchToVercelBtn');
        checkElement('checkHealthBtn');
        checkElement('renderHealthStatus');
        checkElement('vercelHealthStatus');
        checkElement('backendNotification');
        
        // Check if backend functions exist
        log('\\nChecking Backend Functions:', 'info');
        if (typeof getStoredBackend === 'function') {
            log('✅ getStoredBackend function exists', 'success');
        } else {
            log('❌ getStoredBackend function missing', 'error');
        }
        
        if (typeof setBackend === 'function') {
            log('✅ setBackend function exists', 'success');
        } else {
            log('❌ setBackend function missing', 'error');
        }
        
        if (typeof initializeBackendManagement === 'function') {
            log('✅ initializeBackendManagement function exists', 'success');
        } else {
            log('❌ initializeBackendManagement function missing', 'error');
        }
        
        // Check API_BASE_URL variables
        log('\\nChecking API Variables:', 'info');
        if (typeof API_BASE_URL_RENDER !== 'undefined') {
            log('✅ API_BASE_URL_RENDER: ' + API_BASE_URL_RENDER, 'success');
        } else {
            log('❌ API_BASE_URL_RENDER missing', 'error');
        }
        
        if (typeof API_BASE_URL_VERCEL !== 'undefined') {
            log('✅ API_BASE_URL_VERCEL: ' + API_BASE_URL_VERCEL, 'success');
        } else {
            log('❌ API_BASE_URL_VERCEL missing', 'error');
        }
        
        if (typeof API_BASE_URL !== 'undefined') {
            log('✅ API_BASE_URL: ' + API_BASE_URL, 'success');
        } else {
            log('❌ API_BASE_URL missing', 'error');
        }
    </script>
</body>
</html>
