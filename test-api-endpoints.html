<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Endpoint Tester - Vercel vs Render</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        label {
            font-weight: 600;
            color: #495057;
        }
        
        input[type="text"], input[type="password"], input[type="email"] {
            padding: 10px 15px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
            min-width: 200px;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .test-section {
            padding: 30px;
        }
        
        .endpoint-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .endpoint-card {
            border: 2px solid #dee2e6;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s;
        }
        
        .endpoint-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        
        .endpoint-header {
            background: #f8f9fa;
            padding: 15px 20px;
            border-bottom: 2px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .endpoint-title {
            font-weight: 700;
            color: #212529;
            font-size: 16px;
        }
        
        .endpoint-method {
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
        }
        
        .method-get { background: #28a745; color: white; }
        .method-post { background: #007bff; color: white; }
        .method-put { background: #ffc107; color: #212529; }
        .method-delete { background: #dc3545; color: white; }
        
        .endpoint-body {
            padding: 20px;
        }
        
        .endpoint-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .results-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .result-box {
            border: 2px solid #dee2e6;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .result-header {
            padding: 10px 15px;
            font-weight: 600;
            font-size: 14px;
        }
        
        .result-vercel { background: #000; color: white; }
        .result-render { background: #667eea; color: white; }
        
        .result-content {
            padding: 15px;
            background: #f8f9fa;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .status-success { color: #28a745; font-weight: bold; }
        .status-error { color: #dc3545; font-weight: bold; }
        .status-pending { color: #ffc107; font-weight: bold; }
        
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: white;
        }
        
        .summary-vercel { background: #000; }
        .summary-render { background: #667eea; }
        
        .summary-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .summary-label {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .auth-info {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        
        .auth-info strong {
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 API Endpoint Tester</h1>
            <div class="subtitle">Test Vercel vs Render Backend Comparison</div>
        </header>
        
        <div class="controls">
            <div class="control-group">
                <label>Email:</label>
                <input type="email" id="testEmail" placeholder="test@example.com" value="">
            </div>
            <div class="control-group">
                <label>Password:</label>
                <input type="password" id="testPassword" placeholder="password" value="">
            </div>
            <div class="control-group">
                <button class="btn-secondary" onclick="quickRegisterAndLogin()">🚀 Quick Register + Login</button>
                <button class="btn-primary" onclick="testLogin()">🔐 Login Only</button>
                <button class="btn-danger" onclick="authToken = ''; localStorage.removeItem('test_jwt_token'); updateAuthStatus();">🚪 Logout</button>
            </div>
            <div class="control-group">
                <button class="btn-success" onclick="testAllEndpoints()">▶️ Test All Endpoints</button>
                <button class="btn-danger" onclick="clearAllResults()">🗑️ Clear Results</button>
            </div>
        </div>
        
        <div class="test-section">
            <div id="authInfo" class="auth-info" style="display: none;">
                <strong>🔑 Authentication:</strong> <span id="authStatus">Not logged in</span>
            </div>
            
            <div class="summary">
                <div class="summary-card summary-vercel">
                    <div class="summary-number" id="vercelSuccess">0</div>
                    <div class="summary-label">Vercel ✅</div>
                </div>
                <div class="summary-card summary-vercel">
                    <div class="summary-number" id="vercelFail">0</div>
                    <div class="summary-label">Vercel ❌</div>
                </div>
                <div class="summary-card summary-render">
                    <div class="summary-number" id="renderSuccess">0</div>
                    <div class="summary-label">Render ✅</div>
                </div>
                <div class="summary-card summary-render">
                    <div class="summary-number" id="renderFail">0</div>
                    <div class="summary-label">Render ❌</div>
                </div>
            </div>
            
            <div class="endpoint-grid" id="endpointsGrid"></div>
        </div>
    </div>
    
    <script>
        const VERCEL_URL = 'https://praiseand-worship.vercel.app';
        const RENDER_URL = 'https://praiseandworship.onrender.com';
        
        let authToken = localStorage.getItem('test_jwt_token') || '';
        let testResults = {
            vercel: { success: 0, fail: 0 },
            render: { success: 0, fail: 0 }
        };
        
        const endpoints = [
            {
                name: 'Health Check',
                path: '/api/health',
                method: 'GET',
                requiresAuth: false,
                testFn: async (baseUrl) => {
                    const response = await fetch(`${baseUrl}/api/health`);
                    const data = await response.json();
                    return { status: response.status, data };
                }
            },
            {
                name: 'Get All Songs',
                path: '/api/songs',
                method: 'GET',
                requiresAuth: false,
                testFn: async (baseUrl) => {
                    const response = await fetch(`${baseUrl}/api/songs`);
                    const data = await response.json();
                    return { status: response.status, data: { count: data.length, sample: data[0] } };
                }
            },
            {
                name: 'Register User',
                path: '/api/register',
                method: 'POST',
                requiresAuth: false,
                testFn: async (baseUrl) => {
                    const randomSuffix = Date.now();
                    const response = await fetch(`${baseUrl}/api/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            firstName: 'Test',
                            lastName: 'User',
                            username: `testuser${randomSuffix}`,
                            email: `test${randomSuffix}@example.com`,
                            phone: '+1234567890',
                            password: 'test123',
                            isAdmin: false
                        })
                    });
                    const data = await response.json();
                    return { status: response.status, data };
                }
            },
            {
                name: 'Login',
                path: '/api/login',
                method: 'POST',
                requiresAuth: false,
                testFn: async (baseUrl) => {
                    const usernameOrEmail = document.getElementById('testEmail').value;
                    const password = document.getElementById('testPassword').value;
                    const response = await fetch(`${baseUrl}/api/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ usernameOrEmail, password })
                    });
                    const data = await response.json();
                    if (response.ok && data.token) {
                        authToken = data.token;
                        localStorage.setItem('test_jwt_token', authToken);
                        updateAuthStatus();
                    }
                    return { status: response.status, data };
                }
            },
            {
                name: 'Get User Data',
                path: '/api/userdata',
                method: 'GET',
                requiresAuth: true,
                testFn: async (baseUrl) => {
                    const response = await fetch(`${baseUrl}/api/userdata`, {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });
                    const data = await response.json();
                    return { status: response.status, data };
                }
            },
            {
                name: 'Update User Data',
                path: '/api/userdata',
                method: 'PUT',
                requiresAuth: true,
                testFn: async (baseUrl) => {
                    const response = await fetch(`${baseUrl}/api/userdata`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${authToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            favorites: [1, 2, 3],
                            transpose: { '1': 2, '2': -1 }
                        })
                    });
                    const data = await response.json();
                    return { status: response.status, data };
                }
            },
            {
                name: 'Add Song',
                path: '/api/songs',
                method: 'POST',
                requiresAuth: true,
                testFn: async (baseUrl) => {
                    const response = await fetch(`${baseUrl}/api/songs`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${authToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            title: `Test Song ${Date.now()}`,
                            key: 'C',
                            lyrics: 'Test lyrics',
                            category: 'Praise',
                            tempo: 120
                        })
                    });
                    const data = await response.json();
                    return { status: response.status, data };
                }
            },
            {
                name: 'Get Global Setlists',
                path: '/api/global-setlists',
                method: 'GET',
                requiresAuth: false,
                testFn: async (baseUrl) => {
                    const response = await fetch(`${baseUrl}/api/global-setlists`);
                    const data = await response.json();
                    return { status: response.status, data: { count: data.length, sample: data[0] } };
                }
            },
            {
                name: 'Get My Setlists',
                path: '/api/my-setlists',
                method: 'GET',
                requiresAuth: true,
                testFn: async (baseUrl) => {
                    const response = await fetch(`${baseUrl}/api/my-setlists`, {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });
                    const data = await response.json();
                    return { status: response.status, data: { count: data.length } };
                }
            },
            {
                name: 'Get Recommendation Weights',
                path: '/api/recommendation-weights',
                method: 'GET',
                requiresAuth: false,
                testFn: async (baseUrl) => {
                    const response = await fetch(`${baseUrl}/api/recommendation-weights`);
                    const data = await response.json();
                    return { status: response.status, data };
                }
            },
            {
                name: 'Password Reset (Initiate)',
                path: '/api/forgot-password',
                method: 'POST',
                requiresAuth: false,
                testFn: async (baseUrl) => {
                    const response = await fetch(`${baseUrl}/api/forgot-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            identifier: 'test@example.com',
                            method: 'email'
                        })
                    });
                    const data = await response.json();
                    return { status: response.status, data };
                }
            }
        ];
        
        function updateAuthStatus() {
            const authInfo = document.getElementById('authInfo');
            const authStatus = document.getElementById('authStatus');
            
            if (authToken) {
                try {
                    const payload = JSON.parse(atob(authToken.split('.')[1]));
                    authStatus.textContent = `Logged in as ${payload.email || 'user'}`;
                    authInfo.style.display = 'block';
                } catch (e) {
                    authStatus.textContent = 'Token present but invalid';
                    authInfo.style.display = 'block';
                }
            } else {
                authStatus.textContent = 'Not logged in';
                authInfo.style.display = 'none';
            }
        }
        
        function renderEndpoints() {
            const grid = document.getElementById('endpointsGrid');
            grid.innerHTML = '';
            
            endpoints.forEach((endpoint, index) => {
                const card = document.createElement('div');
                card.className = 'endpoint-card';
                card.innerHTML = `
                    <div class="endpoint-header">
                        <div class="endpoint-title">${endpoint.name}</div>
                        <span class="endpoint-method method-${endpoint.method.toLowerCase()}">${endpoint.method}</span>
                    </div>
                    <div class="endpoint-body">
                        <div class="endpoint-actions">
                            <button class="btn-primary" onclick="testEndpoint(${index}, 'vercel')">
                                Test Vercel
                            </button>
                            <button class="btn-primary" onclick="testEndpoint(${index}, 'render')">
                                Test Render
                            </button>
                            <button class="btn-success" onclick="testEndpoint(${index}, 'both')">
                                Test Both
                            </button>
                        </div>
                        ${endpoint.requiresAuth ? '<div style="color: #ffc107; font-size: 12px; margin-bottom: 10px;">🔒 Requires Authentication</div>' : ''}
                        <div class="results-container">
                            <div class="result-box">
                                <div class="result-header result-vercel">Vercel</div>
                                <div class="result-content" id="result-vercel-${index}">Not tested yet</div>
                            </div>
                            <div class="result-box">
                                <div class="result-header result-render">Render</div>
                                <div class="result-content" id="result-render-${index}">Not tested yet</div>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        
        async function testEndpoint(index, backend) {
            const endpoint = endpoints[index];
            
            if (endpoint.requiresAuth && !authToken) {
                alert('Please login first to test authenticated endpoints!');
                return;
            }
            
            const backends = backend === 'both' ? ['vercel', 'render'] : [backend];
            
            for (const be of backends) {
                const resultEl = document.getElementById(`result-${be}-${index}`);
                const baseUrl = be === 'vercel' ? VERCEL_URL : RENDER_URL;
                
                resultEl.innerHTML = '<div class="loading"></div>Testing...';
                
                try {
                    const startTime = Date.now();
                    const result = await endpoint.testFn(baseUrl);
                    const endTime = Date.now();
                    const duration = endTime - startTime;
                    
                    const isSuccess = result.status >= 200 && result.status < 300;
                    
                    if (isSuccess) {
                        testResults[be].success++;
                    } else {
                        testResults[be].fail++;
                    }
                    
                    updateSummary();
                    
                    const errorHint = !isSuccess && result.status === 400 
                        ? '<div style="color: #ffc107; margin-top: 5px; padding: 8px; background: rgba(255,193,7,0.1); border-radius: 4px;">💡 <strong>Hint:</strong> ' + 
                          (endpoint.name === 'Login' ? 'User not found. Click "Quick Register + Login" to create an account first.' : 
                           endpoint.name === 'Register User' ? 'User might already exist. Try "Login Only" instead.' :
                           'Bad request - check the request data.') + '</div>'
                        : '';
                    
                    resultEl.innerHTML = `
                        <div class="${isSuccess ? 'status-success' : 'status-error'}">
                            Status: ${result.status} ${isSuccess ? '✅' : '❌'}
                        </div>
                        <div>Time: ${duration}ms</div>
                        ${errorHint}
                        <div style="margin-top: 10px;">Response:</div>
                        <pre>${JSON.stringify(result.data, null, 2)}</pre>
                    `;
                } catch (error) {
                    testResults[be].fail++;
                    updateSummary();
                    
                    resultEl.innerHTML = `
                        <div class="status-error">Error: ${error.message} ❌</div>
                        <div style="color: #ffc107; margin-top: 5px;">💡 Network or CORS error. Check console for details.</div>
                        <pre>${error.stack || 'No stack trace available'}</pre>
                    `;
                }
            }
        }
        
        async function testLogin() {
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            
            if (!email || !password) {
                alert('❌ Please enter both email and password!');
                return;
            }
            
            const loginIndex = endpoints.findIndex(e => e.name === 'Login');
            if (loginIndex !== -1) {
                // Test login on both backends
                await testEndpoint(loginIndex, 'both');
                
                // Check if login failed with 400 error
                setTimeout(() => {
                    const vercelResult = document.getElementById('result-vercel-' + loginIndex);
                    const renderResult = document.getElementById('result-render-' + loginIndex);
                    
                    const vercelFailed = vercelResult && vercelResult.textContent.includes('400');
                    const renderFailed = renderResult && renderResult.textContent.includes('400');
                    
                    if (vercelFailed || renderFailed) {
                        const shouldRegister = confirm(
                            '❌ Login failed - User not found!\n\n' +
                            'Would you like to register this user and try again?\n\n' +
                            'Email: ' + email + '\n' +
                            'Password: ' + password
                        );
                        
                        if (shouldRegister) {
                            quickRegisterAndLogin();
                        }
                    }
                }, 1000);
            }
        }
        
        async function testRegister() {
            const registerIndex = endpoints.findIndex(e => e.name === 'Register User');
            if (registerIndex !== -1) {
                await testEndpoint(registerIndex, 'both');
            }
        }
        
        async function quickRegisterAndLogin() {
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            
            if (!email || !password) {
                alert('❌ Please enter both email and password first!');
                return;
            }
            
            // First, try to register
            const randomSuffix = Math.floor(Math.random() * 10000);
            const testEmail = email || 'test' + randomSuffix + '@example.com';
            const testPassword = password || 'test123';
            const testUsername = 'testuser' + randomSuffix;
            
            document.getElementById('testEmail').value = testEmail;
            document.getElementById('testPassword').value = testPassword;
            
            console.log('Step 1: Attempting to register user...');
            
            try {
                // Register on both backends
                for (const backend of ['vercel', 'render']) {
                    const baseUrl = backend === 'vercel' ? VERCEL_URL : RENDER_URL;
                    console.log('Registering on ' + backend + '...');
                    
                    const response = await fetch(baseUrl + '/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            firstName: 'Test',
                            lastName: 'User',
                            username: testUsername,
                            email: testEmail,
                            phone: '+1234567890',
                            password: testPassword,
                            isAdmin: false
                        })
                    });
                    
                    const data = await response.json();
                    console.log(backend + ' register response:', response.status, data);
                    
                    if (response.ok && data.token) {
                        authToken = data.token;
                        localStorage.setItem('test_jwt_token', authToken);
                        console.log('Registered and logged in on ' + backend + '!');
                    }
                }
                
                updateAuthStatus();
                
                // Small delay then try login to confirm
                await new Promise(resolve => setTimeout(resolve, 500));
                
                console.log('Step 2: Confirming login...');
                await testLogin();
                
                alert('Success!\n\nUsername: ' + testUsername + '\nEmail: ' + testEmail + '\nPassword: ' + testPassword + '\n\nYou can now test authenticated endpoints!');
                
            } catch (error) {
                console.error('Quick register failed:', error);
                alert('Registration failed: ' + error.message + '\n\nTry manually using the "Register User" endpoint test.');
            }
        }
        
        async function testAllEndpoints() {
            if (!authToken) {
                const shouldLogin = confirm('No auth token found. Do you want to login first?');
                if (shouldLogin) {
                    await testLogin();
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
            }
            
            for (let i = 0; i < endpoints.length; i++) {
                await testEndpoint(i, 'both');
                await new Promise(resolve => setTimeout(resolve, 500));
            }
        }
        
        function clearAllResults() {
            endpoints.forEach((_, index) => {
                document.getElementById(`result-vercel-${index}`).textContent = 'Not tested yet';
                document.getElementById(`result-render-${index}`).textContent = 'Not tested yet';
            });
            
            testResults = {
                vercel: { success: 0, fail: 0 },
                render: { success: 0, fail: 0 }
            };
            updateSummary();
        }
        
        function updateSummary() {
            document.getElementById('vercelSuccess').textContent = testResults.vercel.success;
            document.getElementById('vercelFail').textContent = testResults.vercel.fail;
            document.getElementById('renderSuccess').textContent = testResults.render.success;
            document.getElementById('renderFail').textContent = testResults.render.fail;
        }
        
        // Initialize
        updateAuthStatus();
        renderEndpoints();
    </script>
</body>
</html>
