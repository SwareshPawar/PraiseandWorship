<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Password Reset CORS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Password Reset CORS Test</h1>
    
    <div>
        <h3>Test 1: Check Vercel API Endpoint</h3>
        <button onclick="testEndpoint()">Test Endpoint Availability</button>
        <div id="endpoint-result" class="result"></div>
    </div>

    <div>
        <h3>Test 2: Test Password Reset Request</h3>
        <input type="text" id="testIdentifier" placeholder="Enter email or phone" style="width: 100%; padding: 8px; margin: 5px 0;">
        <select id="testMethod" style="width: 100%; padding: 8px; margin: 5px 0;">
            <option value="email">Email</option>
            <option value="sms">SMS</option>
        </select>
        <button onclick="testPasswordReset()">Test Password Reset</button>
        <div id="reset-result" class="result"></div>
    </div>

    <script>
        const API_BASE_URL_VERCEL = 'https://praiseand-worship.vercel.app';

        async function testEndpoint() {
            const resultDiv = document.getElementById('endpoint-result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.innerHTML = 'Testing...';

            try {
                const response = await fetch(`${API_BASE_URL_VERCEL}/api/health`, {
                    method: 'GET',
                    mode: 'cors'
                });

                if (response.ok) {
                    const data = await response.json();
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ Success!</strong><br>
                        Status: ${response.status}<br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>❌ Failed</strong><br>
                        Status: ${response.status} ${response.statusText}
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <strong>❌ Error:</strong><br>
                    ${error.message}<br><br>
                    <strong>Details:</strong><br>
                    ${error.stack}
                `;
            }
        }

        async function testPasswordReset() {
            const resultDiv = document.getElementById('reset-result');
            const identifier = document.getElementById('testIdentifier').value;
            const method = document.getElementById('testMethod').value;

            if (!identifier) {
                alert('Please enter an email or phone number');
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.innerHTML = 'Testing password reset...';

            try {
                console.log('🔐 Testing password reset:', {
                    url: `${API_BASE_URL_VERCEL}/api/forgot-password`,
                    identifier,
                    method
                });

                const response = await fetch(`${API_BASE_URL_VERCEL}/api/forgot-password`, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ identifier, method })
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ Success!</strong><br>
                        ${data.message}<br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>❌ Failed</strong><br>
                        Status: ${response.status}<br>
                        Error: ${data.error}<br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                console.error('Password reset error:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <strong>❌ Network Error:</strong><br>
                    ${error.message}<br><br>
                    <strong>Stack:</strong><br>
                    <pre>${error.stack}</pre>
                `;
            }
        }
    </script>
</body>
</html>
